# Package metadata + tool config only. Dependencies live in requirements.txt (do not duplicate pins here).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myomotion"
version = "0.1.0"
description = "MyoMotion: camera-based exercise biomechanics and sEMG-estimated muscle activation (FAST-NUCES FYP)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
